name: test

# Reusable — the single definition of "this commit is green".
#
# Both the PR/push gate (ci.yml) and the release gate (publish.yml) call this
# job rather than repeating its steps. That matters more than it looks: if the
# two paths kept their own copies, a check added to one would silently be
# missing from the other, and you would get green pull requests followed by a
# failing release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 is the Active LTS line, and it ships npm 11.x — above the
      # 11.5.0 floor OIDC trusted publishing needs. Node 22 would ship npm 10.x
      # and require an extra `npm install -g npm@latest` step.
      # `.nvmrc` is the single source of truth for the version; keep it in sync.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails if package-lock.json and package.json disagree, which is
      # exactly the check we want before anything ships.
      - run: npm ci

      # `tsc --noEmit` over src, example and test — the repo runs from source.
      - run: npm run typecheck

      # GITHUB_CLIENT_ID/SECRET are the knobs the example uses to decide
      # whether to wire GitHub login and gate /mcp. One auth test asserts the
      # gate challenge, so it needs them set to non-empty values. They are
      # placeholders: the suite never calls GitHub (tokens are minted locally
      # through better-auth's signJWT, never through the OAuth exchange), so no
      # network access or real credentials are involved.
      - name: Test
        run: npm test
        env:
          GITHUB_CLIENT_ID: ci-placeholder-id
          GITHUB_CLIENT_SECRET: ci-placeholder-secret

      # The emit has its own config (tsconfig.build.json) on top of the
      # typecheck, so it can break on its own — a broken rewrite of the `.ts`
      # import specifiers, for instance. Catch that here instead of at tag time.
      - name: Build
        run: npm run build
